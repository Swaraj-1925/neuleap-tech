services:
  db:
    image: postgres:16
    container_name: weather-db
    restart: always
    environment:
      POSTGRES_DB: weather_data
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
  api:
      build: .
      container_name: weather-api
      depends_on:
        - db
      ports:
        - "8000:8000"
      environment:
        POSTGRES_DB: weather_data
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
        POSTGRES_HOST: db
        POSTGRES_PORT: 5432
      command: >
        python -m uvicorn main:app
        --host 0.0.0.0
        --port 8000
        --reload
      volumes:
        - .:/app

volumes:
  postgres_data:
